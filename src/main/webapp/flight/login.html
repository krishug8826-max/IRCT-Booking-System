
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKYPRO | PILOT LOGIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --accent: #ff00ea; --neon-blue: #00f2ff; --card-bg: rgba(10, 5, 20, 0.95); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            background: #000; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at center, rgba(112, 0, 255, 0.1) 0%, #000 100%);
        }
        .login-box {
            width: 100%; max-width: 450px; padding: 40px; background: var(--card-bg);
            border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 50px rgba(112, 0, 255, 0.3); text-align: center;
        }
        .logo { font-family: 'Orbitron'; color: var(--accent); font-size: 30px; letter-spacing: 5px; margin-bottom: 30px; }
        .field { position: relative; margin-bottom: 25px; text-align: left; }
        .field i { position: absolute; left: 15px; top: 45px; color: var(--accent); }
        label { color: var(--neon-blue); font-family: 'Orbitron'; font-size: 12px; letter-spacing: 2px; }
        input {
            width: 100%; padding: 15px 15px 15px 45px; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--accent); box-shadow: 0 0 15px rgba(255, 0, 234, 0.3); }
        .btn-login {
            width: 100%; padding: 18px; background: linear-gradient(90deg, #7000ff, var(--accent));
            border: none; border-radius: 12px; color: white; font-family: 'Orbitron';
            font-weight: 900; cursor: pointer; letter-spacing: 3px; transition: 0.5s;
        }
        .btn-login:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(255, 0, 234, 0.5); }
        .footer { margin-top: 20px; color: #888; font-size: 14px; }
        .footer a { color: var(--accent); text-decoration: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">SKYPRO</div>
        <form action="../LoginUser" method="POST">
            <div class="field">
                <label>EMAIL ID</label>
                <i class="fas fa-envelope"></i>
                <input type="email" name="email" placeholder="pilot@skypro.com" required>
            </div>
            <div class="field">
                <label>PASSWORD</label>
                <i class="fas fa-lock"></i>
                <input type="password" name="pass" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login">AUTHENTICATE</button>
        </form>
        <div class="footer">
            NEW PILOT? <a href="registration.jsp">CREATE NEW</a>
        </div>
    </div>
</body>
</html>
