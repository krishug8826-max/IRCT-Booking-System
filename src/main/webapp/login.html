
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAILPRO | SECURE LOGIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@300;500;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --accent: #00f2ff; --neon: #ff00ea; --dark-bg: #0d0f14; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: #000; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden;
            background: radial-gradient(circle at center, rgba(0, 242, 255, 0.1) 0%, #000 100%),
                        url('https://images.unsplash.com/photo-1515165597901-b419d788bb52?q=80&w=2000&auto=format&fit=crop') no-repeat center center/cover fixed;
        }

        /* The "Dam" Box - Animated Border */
        .login-wrapper {
            position: relative; width: 95%; max-width: 450px; padding: 3px; border-radius: 30px;
            background: linear-gradient(45deg, var(--accent), var(--neon), var(--accent));
            background-size: 200%; animation: borderRotate 4s linear infinite;
            box-shadow: 0 0 50px rgba(0, 242, 255, 0.2);
        }
        @keyframes borderRotate { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }

        .login-card {
            background: rgba(13, 15, 20, 0.98); border-radius: 27px; padding: 50px 40px; text-align: center; backdrop-filter: blur(20px);
        }

        .login-card h1 {
            font-family: 'Orbitron', sans-serif; font-size: 32px; letter-spacing: 5px; color: #fff; margin-bottom: 10px;
        }

        /* Effort Line */
        .line-effort {
            height: 4px; width: 60px; background: var(--accent); border-radius: 10px; margin: 0 auto 40px;
            box-shadow: 0 0 15px var(--accent); animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { width: 50px; opacity: 0.5; } 50% { width: 100px; opacity: 1; } }

        .input-group { position: relative; margin-bottom: 30px; text-align: left; }
        .input-group label {
            display: block; font-family: 'Orbitron'; font-size: 11px; color: var(--accent); margin-bottom: 10px; letter-spacing: 2px; font-weight: 800;
        }
        .input-group input {
            width: 100%; padding: 18px 20px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px; color: white; font-size: 16px; outline: none; transition: 0.3s;
        }
        .input-group input:focus { border-color: var(--accent); background: rgba(255,255,255,0.07); box-shadow: 0 0 20px rgba(0,242,255,0.2); }

        .btn-login {
            width: 100%; padding: 18px; border: none; border-radius: 15px;
            background: linear-gradient(90deg, #ff6a00, #ee0979);
            color: white; font-family: 'Orbitron'; font-size: 18px; font-weight: 900;
            cursor: pointer; transition: 0.4s; letter-spacing: 3px; margin-top: 10px;
            box-shadow: 0 10px 30px rgba(238, 9, 121, 0.4);
        }
        .btn-login:hover { transform: translateY(-5px); box-shadow: 0 15px 50px rgba(238, 9, 121, 0.6); }

        .footer-links { margin-top: 25px; font-size: 13px; color: #666; }
        .footer-links a { color: var(--accent); text-decoration: none; font-weight: 600; }
        .footer-links a:hover { text-decoration: underline; }

        /* Mobile specific adjustments */
        @media (max-width: 480px) {
            .login-card { padding: 40px 25px; }
            .login-card h1 { font-size: 26px; }
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            <h1>LOGIN</h1>
            <div class="line-effort"></div>

            <form action="LoginServlet" method="POST">
                <div class="input-group">
                    <label><i class="fa-solid fa-user"></i> USERNAME</label>
                    <input type="text" name="username" placeholder="Enter ID" required>
                </div>

                <div class="input-group">
                    <label><i class="fa-solid fa-lock"></i> PASSWORD</label>
                    <input type="password" name="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-login">AUTHENTICATE</button>
            </form>

            <div class="footer-links">
                Don't have access? <a href="register.html">Create Account</a><br><br>
                <a href="index.jsp" style="color:#444; font-size:11px;">← Back to System Home</a>
            </div>
        </div>
    </div>

</body>
</html>
